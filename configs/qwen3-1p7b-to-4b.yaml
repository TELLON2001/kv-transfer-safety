# Model-pair config: Qwen3-1.7B (sharer) -> Qwen3-4B (receiver).
# This is the Phase 2 reproduction pair. Everything the harness needs to run one
# condition lives here, so a run is fully described by (this file + a commit SHA).

pair_id: qwen3-1p7b-to-4b

sharer:
  model_id: Qwen/Qwen3-1.7B      # prefills, then its KV cache is mapped to the receiver
  dtype: bfloat16
receiver:
  model_id: Qwen/Qwen3-4B        # decodes; in the Mapped condition it skips its own prefill
  dtype: bfloat16

# Eligibility: the mapper only works when these match across the pair. The harness
# asserts these against the loaded model configs before running (see src/eligibility.py).
# Fill the "expected" values from the model configs the first time, then they act as a guard.
eligibility:
  require_shared_tokenizer: true
  num_key_value_heads: null      # expected KV-head count (fill from config.json, must match)
  head_dim: null                 # expected head dimension (fill, must match)

# Mapper (Heo et al. closed-form ridge). Confirm field names against the kvtransfer repo.
mapper:
  kind: ridge                    # closed-form per-head ridge mapping
  calibration:
    dataset: HuggingFaceFW/fineweb-edu
    num_sequences: 500           # the paper calibrates on ~500 sequences
    max_seq_len: 1024
  strip_positional_encoding: true
  cache_path: results/mappers/qwen3-1p7b-to-4b.pt   # save/reuse the fitted mapper

# Decoding is held IDENTICAL across every condition so the cache source is the only variable.
decoding:
  seed: 0
  do_sample: false               # greedy; deterministic for reproduction
  temperature: 0.0
  max_new_tokens: 512
  thinking_mode: false           # keep Qwen3 thinking off and fixed

# Token layout: the most load-bearing detail. Record exactly how the prompt is split
# between sharer prefill and receiver decode, and where template/system tokens sit,
# because the interpretation of any refusal change depends on it. Fill after the smoke test.
token_layout:
  chat_template: default_qwen3   # confirm the exact template string used
  system_prompt: null            # null = none; record the literal string if used
  sharer_prefills: prompt        # what the sharer prefills (e.g. full user turn)
  receiver_decodes_from: mapped_cache   # native | mapped_cache | sharer_prefill | mismatched
  notes: >-
    Confirm during the smoke test: does the mapped cache actually carry the user
    prompt tokens, and are positions aligned after positional-encoding strip?

# Reproduction target: one accuracy number to match before measuring anything new.
reproduction:
  task: null                     # lm-eval task name from the paper (fill in)
  reference_accuracy: null       # the paper's number for this pair+task
  tolerance_points: 3            # "within a few points" gate for the week-4 go/no-go
  limit: null                    # optional: subsample for a fast first pass
